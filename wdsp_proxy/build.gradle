plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.qf.soundeffect'
    compileSdk 36

    defaultConfig {
        applicationId "com.qf.soundeffect"
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName "0.3"

        resConfigs "en"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        resValues false
        buildConfig false
    }
}

dependencies {
}
