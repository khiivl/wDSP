plugins {
    alias(libs.plugins.android.application)
}

// Release signing credentials: one place for both modules (signing.gradle).
apply from: rootProject.file('signing.gradle')

android {
    namespace 'com.qf.soundeffect'
    compileSdk 36

    defaultConfig {
        applicationId "com.qf.soundeffect"
        minSdk 28
        targetSdk 28
        // Android 14 inclusive (owner, 02.10.2026). Informational: Android has not enforced
        // maxSdkVersion at install since 2.0.1. It replaces an android:maxSdkVersion="28" that sat
        // on the activity, where the attribute means nothing.
        maxSdk 34
        versionCode 1
        versionName "0.5"

        resConfigs "en"
    }

    // The same release key as wdsp_app (signing.gradle, never in git). The stock QF_DSP is
    // platform-signed; installing this over it as an update needs signature checks disabled
    // (PMPatch3 on the unit).
    signingConfigs {
        release {
            if (wdspSigning != null) {
                storeFile wdspSigning.storeFile
                storePassword wdspSigning.storePassword
                keyAlias wdspSigning.keyAlias
                keyPassword wdspSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (wdspSigning != null) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        resValues false
        buildConfig false
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion', 'GradleDependency'
    }
}

dependencies {
}
